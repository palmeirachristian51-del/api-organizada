<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Criar Pedido</title>
</head>

<body>

    

        <h1>Criar Pedido</h1>

        <form id="form-group">

            <div class="form-group">

                <label class="form-label">ID do Usuário</label>

                <input
                    type="number"
                    id="pedido_usuario"
                    class="form-control"
                    required>
            


            
                <label class="form-label">ID do Produto</label>

                <input
                    type="number"
                    id="pedido_produto"
                    class="form-control"
                    required>
           


           
                <label class="form-label">Quantidade</label>

                <input
                    type="number"
                    id="pedido_quantidade"
                    class="form-control"
                    required>
            </div>


            <button
                type="button"
                class="btn btn-primary"
                onclick="criarPedidos()">

                Cadastrar

            </button>

        </form>

    
        

    <script src="criarPedidos.js"></script>

</body>

</html>
